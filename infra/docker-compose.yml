version: '3.8'

services:
  ai-service:
    build:
      context: ..
      dockerfile: infra/ai-service.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  api-gateway:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service

  web-frontend:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - api-gateway